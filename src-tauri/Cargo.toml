[package]
name = "local-console-hub"
version = "0.1.0"
description = "Local Console Hub — unified console for Windows local services and terminals"
authors = ["Local Console Hub contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_console_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T01 config schema: YAML is the user-facing config format (D-010).
serde_yaml = "0.9"
# Service URL validation (http/https only).
url = "2"
# Config/log path timestamps: pure UTC math + explicit offsets, no clock.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Platform app-data roots (%APPDATA% / %LOCALAPPDATA%).
dirs = "7"

# T03 process supervisor (SUPERVISION): job-object ownership, tree enumeration
# and CTRL_BREAK delivery for the safe stop/kill-tree path. Windows-only, and
# already present in Cargo.lock as a transitive dependency, so this adds no new
# packages to the build.
#
# Win32_Security is not optional here: `CreateJobObjectW` takes a
# SECURITY_ATTRIBUTES parameter, and windows-sys gates a function behind every
# module its signature names — so JobObjects alone does not expose it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
