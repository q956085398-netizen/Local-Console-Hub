[package]
name = "local-console-hub"
version = "0.1.0"
description = "Local Console Hub — unified console for Windows local services and terminals"
authors = ["Local Console Hub contributors"]
edition = "2021"
rust-version = "1.77.2"

[features]
# Explicitly built acceptance binaries use private data roots, never user data.
acceptance = []

[lib]
name = "local_console_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is T09's native tray (spec §11): the icon, its menu, and the
# hide-on-close lifecycle D-006 decides. It gates `dep:tray-icon` (and, through
# it, `muda`'s tray support) — both already in Cargo.lock as this crate's
# optional dependencies, so enabling the feature downloads no new package. The
# layer on top of them is `tray/`.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T01 config schema: YAML is the user-facing config format (D-010).
serde_yaml = "0.9"
# Service URL validation (http/https only).
url = "2"
# Config/log path timestamps: pure UTC math + explicit offsets, no clock.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Platform app-data roots (%APPDATA% / %LOCALAPPDATA%).
dirs = "7"
# T07 terminal output transport: a terminal's bytes are not text (a chunk
# boundary can fall inside a multi-byte character), so they cross the IPC
# boundary base64-encoded rather than decoded per chunk. Already in Cargo.lock
# as a transitive dependency of tauri, so this adds no new packages.
base64 = "0.22"

# windows-sys backs both Windows layers: T03 process supervision
# (SUPERVISION: job-object ownership, tree enumeration and CTRL_BREAK delivery
# for the safe stop/kill-tree path) and the T02 PTY backend (CONPTY:
# pseudoconsole creation/resize/close plus the pipe and process-creation calls
# a ConPTY session needs, D-014). Windows-only, and already present in
# Cargo.lock as a transitive dependency, so this adds no new packages.
#
# Win32_Security is not optional here: `CreateJobObjectW` takes a
# SECURITY_ATTRIBUTES parameter, and windows-sys gates a function behind every
# module its signature names — so JobObjects alone does not expose it.
# Win32_System_Pipes carries `CreatePipe`, the two anonymous pipes around every
# pseudoconsole.
# Win32_System_Diagnostics_ToolHelp finds the suspended process's initial
# thread by owner PID so it can be resumed only after Job assignment.
#
# Win32_System_Time carries `GetTimeZoneInformation`, the T01 path-layout
# helper's source for the local UTC offset that decides which month directory a
# run's log belongs to (`docs/DECISIONS.md` D-011). It replaces pulling
# chrono's `clock` feature in for one integer: chrono's `Local` needs the
# iana-time-zone crate on Windows, where the OS call is already a dependency.
#
# Win32_UI_Shell + Win32_UI_WindowsAndMessaging carry the T10 shell handoff
# (`shell/win.rs`): `ShellExecuteW` is gated behind the first feature, and its
# `nshowcmd` parameter behind the second, so both are required for one call.
# Enabling them downloads nothing — windows-sys gates modules, not packages.
#
# Win32_UI_WindowsAndMessaging has a second consumer since T09: the app's native
# message boxes (`dialog.rs`) are how the user is asked about Exit, or told that
# a launch was not delivered, while the window is hidden or absent (spec §11).
#
# Win32_Storage_FileSystem and Win32_System_IO arrived with the single-instance
# entry (#60, `instance/win.rs`): the Hub's identity is a named mutex and a
# named pipe, and windows-sys gates those calls behind what they take —
# `CreateNamedPipeW` needs the file-system flags, `ConnectNamedPipe` and the
# `OVERLAPPED` parameter of `ReadFile`/`WriteFile` need the IO module. Enabling
# them downloads nothing, like every other feature here.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
