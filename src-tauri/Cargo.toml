[package]
name = "local-console-hub"
version = "0.1.0"
description = "Local Console Hub — unified console for Windows local services and terminals"
authors = ["Local Console Hub contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_console_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T01 config schema: YAML is the user-facing config format (D-010).
serde_yaml = "0.9"
# Service URL validation (http/https only).
url = "2"
# Config/log path timestamps: pure UTC math + explicit offsets, no clock.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Platform app-data roots (%APPDATA% / %LOCALAPPDATA%).
dirs = "7"
