[package]
name = "local-console-hub"
version = "0.1.0"
description = "Local Console Hub — unified console for Windows local services and terminals"
authors = ["Local Console Hub contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_console_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
