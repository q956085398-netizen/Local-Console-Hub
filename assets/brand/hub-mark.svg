<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 16 16">
  <!-- Local Console Hub — the Hub icon, in one place (D-029).

       Taken from the upstream design project that produced the V2 reference
       images, verbatim: `E:\Grok-UI-Design\LocalConsoleHub\public\favicon.svg`
       (only its `role` and `aria-label` document attributes are left out; they
       describe a favicon slot, not the drawing).

       Why this file rather than the earlier transcription of the same mark: it
       is drawn on a 16-unit grid with the weights a 16px slot needs, and its
       tile fills the canvas instead of 75% of it. At the sizes Windows actually
       renders — 16px in the notification area, 32px in the taskbar — that is
       the difference between the status dot and the list rows reading as
       themselves and reading as a blur.

       The four corners stay transparent: the tile is a rounded rect and nothing
       paints behind it, so the rasterized set has alpha 0 there (checked on
       `icon.png`, `32x32.png` and `icon.ico` — see `docs/VERIFICATION.md` §6).

       Regenerate the native set after editing (the rasterizer is installed with
       `npm install @resvg/resvg-js` and deliberately kept out of package.json):

         node scripts/generate-icon.mjs
         npx tauri icon assets/brand/hub-mark-1024.png -->
  <rect width="16" height="16" rx="3" fill="#0b0c0f" />
  <rect x="1" y="1" width="14" height="14" rx="2.25" fill="#181a21" />
  <circle cx="4" cy="4.5" r="1.2" fill="#6fba8a" />
  <rect x="6.2" y="3.7" width="6.5" height="1.6" rx="0.8" fill="#c5ccd6" />
  <rect x="2.8" y="7.5" width="10.4" height="1.5" rx="0.75" fill="#8f929c" />
  <rect x="2.8" y="10.7" width="7.2" height="1.5" rx="0.75" fill="#8f929c" />
</svg>
