<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Local Console Hub app icon source.
       Visual language per docs/UI_STYLE_GUIDE.md §10:
       dark near-black surface, thin border, blue accent, terminal prompt motif.
       Regenerate raster sets with scripts/generate-icon.mjs + `npx tauri icon`. -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e26" />
      <stop offset="1" stop-color="#0f1115" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="184" fill="url(#surface)" stroke="#2a2f3a" stroke-width="8" />
  <!-- prompt chevron -->
  <polyline
    points="268,336 500,512 268,688"
    fill="none"
    stroke="#4c8dff"
    stroke-width="76"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- block cursor -->
  <rect x="572" y="610" width="184" height="78" rx="20" fill="#e6e8ee" />
</svg>
